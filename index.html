/* Korean messenger-inspired refresh */
:root{--k-yellow:#fee500;--k-blue:#abc1d1;--k-text:#262626}
html{background:#fff}body{color:var(--k-text);background:#fff;letter-spacing:-.25px}

.chat{background:var(--k-blue)}

.panel{border-radius:18px}.panel h2{font-size:19px}

main{padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* Interactive Korean profile, moments and personalization */

.settings-sheet input,.settings-sheet select,.settings-sheet textarea{display:block;margin:0 24px;width:calc(100% - 48px);border:1px solid #ddd;border-radius:10px;padding:12px;background:white;font:inherit}
.settings-save{display:block;margin:25px 24px;background:#fee500;border-radius:12px;padding:13px;width:calc(100% - 48px)}
.day-divider{text-align:center;align-self:center;background:#7e96a688;color:#fff;border-radius:15px;padding:5px 15px;font-size:11px;margin:7px 0}
.typing{font-size:12px;color:#526d7f;padding:0 14px 8px;min-height:20px;display:flex;align-items:center;gap:5px}.typing-dots{display:inline-flex;gap:3px}.typing-dots i{display:block;width:5px;height:5px;background:#526d7f;border-radius:50%;animation:kkt-dot 1.2s infinite}.typing-dots i:nth-child(2){animation-delay:.2s}.typing-dots i:nth-child(3){animation-delay:.4s}@keyframes kkt-dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.typing-dots i{animation:none}}

.profile-link{margin-left:7px;background:transparent;color:#aaa;font-size:12px;padding:2px 4px}

/* KKT 3.0 */
.call-sheet,.editor-sheet,.album-sheet{display:none;position:fixed;inset:0;z-index:24;background:#fff;overflow:auto}.call-sheet.show,.editor-sheet.show,.album-sheet.show{display:block}
.call-sheet{background:linear-gradient(160deg,#384f62,#718ca0);color:white;text-align:center;padding:calc(env(safe-area-inset-top) + 65px) 22px 30px}
.call-avatar{font-size:78px;margin:48px auto 16px;width:130px;height:130px;border-radius:46px;background:#ffffff26;display:grid;place-items:center}
.call-actions{display:flex;justify-content:space-around;gap:25px;margin-top:85px}.call-actions button{border-radius:50%;width:70px;height:70px;font-size:27px;color:#fff}.call-actions .decline{background:#ee6266}.call-actions .accept{background:#52c879}

.chat-tools{display:flex;align-items:center;gap:9px;padding:5px 14px 8px;background:#fff}.chat-tools button{background:#f5f5f5;border-radius:9px;padding:7px 11px;font-size:12px;color:#444}
.heart-meter{font-size:12px;color:#526879;background:#ffffff80;border-radius:20px;padding:6px 10px;white-space:nowrap}.heart-progress{height:3px;background:#ffffff80;border-radius:6px;margin:0 14px 4px;overflow:hidden}.heart-progress span{display:block;height:100%;width:0;background:#ef91a7;transition:width .3s}.chatbar{padding-bottom:9px}.contact:focus-visible,.chat-tools button:focus-visible{outline:2px solid #d1a900;outline-offset:2px}
.story-notice{align-self:center;text-align:center;background:#ffffffb3;color:#536477;font-size:12px;border-radius:14px;padding:7px 13px;margin:4px}
.image-bubble{font-size:48px;min-width:92px;text-align:center}

/* KKT visual polish — soft Korean messenger */
:root{--surface:#fff;--ink:#25262b;--muted:#8e919a;--accent:#fee65c}
body{background:#f7f7f5;color:var(--ink);-webkit-tap-highlight-color:transparent}
main{background:linear-gradient(180deg,#fffdf5 0,#fff 190px);box-shadow:0 0 36px #25304009}
header{background:transparent;padding-bottom:13px}

header button{width:38px;height:38px;border-radius:14px;background:#fff4c9;font-size:26px;display:grid;place-items:center}
.tabs{background:transparent;gap:26px;padding-bottom:11px}
.tabs button{position:relative;transition:color .2s}
.tabs button.active:after{content:"";position:absolute;bottom:1px;left:25%;right:25%;height:3px;background:#f4ce31;border-radius:4px}
.search-wrap{background:#f5f5f3;border:1px solid #f0f0ed;height:43px;border-radius:15px;margin-top:6px;margin-bottom:15px}
.contact{margin:3px 12px;width:calc(100% - 24px);padding:13px 12px;border-radius:19px;transition:background .18s,transform .18s}
.contact:hover{background:#faf9f4}.contact:active{transform:scale(.99)}
.avatar{box-shadow:inset 0 0 0 1px #ffffff75,0 3px 10px #00000008;border-radius:21px}
.name{letter-spacing:-.3px}.preview{line-height:1.4}
.bottom-nav{background:#ffffffed;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #eeeae0;box-shadow:0 -5px 20px #00000005}
.bottom-nav button.selected .nav-icon{color:#c39b0b}
.bottom-nav button{transition:transform .15s}.bottom-nav button:active{transform:scale(.93)}
.chat,.chatbar{background:#b8cbd9}
.chatbar{box-shadow:0 2px 8px #5a76830c}
.chatbar strong{letter-spacing:-.5px}
.messages{padding:20px 14px 28px;gap:17px;scroll-behavior:smooth}
.bubble{border-radius:5px 16px 16px 16px;box-shadow:0 2px 8px #435b6b0b;line-height:1.55}

.msgrow{animation:kkt-arrive .2s ease-out}
@keyframes kkt-arrive{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.day-divider{background:#829ca7a6;padding:6px 15px;border-radius:18px}
.composer{box-shadow:0 -3px 16px #0000000a;padding-top:12px}
.composer input{border:1px solid #eaeaea;background:#f8f8f8;border-radius:18px;min-height:43px}
.composer input:focus{border-color:#eacb50;background:white;box-shadow:0 0 0 3px #ffe97e38}
.composer button{border-radius:13px;padding:12px 18px}
.chat-tools{gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 12px}
.chat-tools::-webkit-scrollbar{display:none}
.chat-tools button{white-space:nowrap;border-radius:12px;background:#f6f5f1;padding:8px 11px}
.profile-sheet,.moments-sheet,.settings-sheet,.editor-sheet,.album-sheet{background:#fdfdfb}
.sheet-top{backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid #f0efeb}
.panel,.moment-card{box-shadow:0 10px 35px #2222220c}
.moment-card{border-radius:20px}
.settings-sheet input,.settings-sheet select,.settings-sheet textarea,.editor-sheet .field input,.editor-sheet .field select{border-radius:13px;background:#fff}
.settings-save,.save-editor,.primary{box-shadow:0 3px 10px #d2b52620}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e6c63d;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.msgrow{animation:none}.messages{scroll-behavior:auto}}

/* KKT 4.0 practical refinements */
.chatbar .chat-actions{display:flex;gap:6px;align-items:center}
.chatbar .chat-actions button{font-size:18px;border-radius:11px;padding:5px 8px;background:#ffffff52}
.msgrow .bubble{cursor:context-menu;user-select:text;-webkit-user-select:text}

.chat-info{display:none;position:fixed;inset:0;z-index:26;background:#0006;align-items:flex-end;justify-content:center}
.chat-info.show{display:flex}
.chat-info-panel{width:100%;max-width:600px;background:#fff;border-radius:23px 23px 0 0;padding:20px 22px calc(env(safe-area-inset-bottom) + 25px);box-shadow:0 -15px 45px #0002}

.contact .unread{margin-left:auto;font-weight:700}
.contact .time{font-variant-numeric:tabular-nums}
</style></head><body><main><header><h1>채팅 <span style="font-size:12px;font-weight:500;color:#999;letter-spacing:0">KKT</span></h1><button id="add" aria-label="添加聊天对象">＋</button></header><nav class="tabs" aria-label="页面栏目"><button class="active" id="tabChats">채팅 · 聊天</button><button id="tabFriends">친구 · 好友</button></nav><div class="search-wrap"><span>⌕</span><input id="searchContacts" placeholder="친구, 채팅 검색 · 搜索好友" aria-label="搜索好友和聊天"></div><section id="list"></section><p class="hint">KKT · 나만의 작은 대화 공간 ♡<br><small>虚构聊天 · 记录仅保存在本机</small></p><nav class="bottom-nav" aria-label="底部导航"><button id="navFriends"><span class="nav-icon">♟</span><small>친구</small></button><button class="selected" id="navChats"><span class="nav-icon">▤</span><small>채팅</small></button><button id="navDiscover"><span class="nav-icon">◉</span><small>발견</small></button><button id="navMore"><span class="nav-icon">•••</span><small>더보기</small></button></nav></main>
<section class="chat" id="chat"><div class="chatbar"><button id="back" aria-label="返回">‹</button><strong id="chatTitle"></strong><span class="heart-meter" id="heartMeter">♡ 0</span><div class="chat-actions"><button id="chatInfoBtn" title="聊天设置" aria-label="聊天设置">☰</button></div></div><div class="heart-progress" aria-label="好感度进度"><span id="heartProgress"></span></div><div class="messages" id="messages"></div><div class="chat-tools"><button id="callBtn">📞 통화</button><button id="albumBtn">▧ 앨범</button><button id="editBtn">✎ 프로필</button><button id="photoBtn">＋ 사진</button></div><div id="typingIndicator" class="typing" aria-live="polite"></div><form class="composer" id="sendForm"><input id="messageInput" placeholder="메시지 보내기 · 发送消息…" autocomplete="off" maxlength="1000"><button type="submit">전송</button></form></section>

<section class="profile-sheet" id="profileSheet"><div class="sheet-top"><button id="profileBack" aria-label="返回">‹</button><strong>프로필 · 个人主页</strong></div><div class="profile-cover"><div class="profile-face" id="profileFace">💛</div></div><div class="profile-info"><h2 id="profileName"></h2><p id="profileStatus">오늘도 좋은 하루 ♡</p><button class="profile-action" id="profileChat">1:1 채팅 · 开始聊天</button></div></section>

<script>
(()=>{'use strict';
const key='kkt-simulator-v2';
const defaults=[{id:'a',name:'小星',emoji:'🐹',messages:[{mine:false,text:'안녕! 今天过得怎么样？',time:'12:30'}]},{id:'b',name:'小海',emoji:'🐻',messages:[{mine:false,text:'有空的时候来找我聊天吧 💛',time:'12:31'}]}];
let people;try{const x=JSON.parse(localStorage.getItem(key));people=Array.isArray(x)?x:defaults}catch(e){people=defaults}
let current=null,tab='chats';
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(key,JSON.stringify(people))}catch(e){}};
const clock=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function renderList(){const list=$('list');list.replaceChildren();const q=$('searchContacts').value.trim().toLowerCase();const filtered=people.filter(p=>!q||(p.name+' '+p.messages.map(m=>m.text).join(' ')).toLowerCase().includes(q));const ordered=tab==='chats'?[...filtered].sort((a,b)=>(b.messages[b.messages.length-1]?.stamp||0)-(a.messages[a.messages.length-1]?.stamp||0)):filtered;ordered.forEach(p=>{const row=el('button','contact');row.type='button';row.append(el('div','avatar',p.emoji||'💛'));const info=el('div','info');info.append(el('div','name',p.name));const last=p.messages[p.messages.length-1];info.append(el('div','preview',tab==='friends'?'点击开始聊天':last?last.text:'새로운 대화를 시작해요 · 开始聊天'));row.append(info,el('span','time',last&&tab==='chats'?last.time:''));if(tab==='chats'&&p.unread){const badge=el('span','unread',String(Math.min(p.unread,99)));row.append(badge)}row.onclick=()=>openChat(p.id);if(tab==='friends'){const prof=el('button','profile-link','프로필 ›');prof.onclick=e=>{e.stopPropagation();showProfile(p.id)};row.append(prof)}list.append(row)});if(!ordered.length)list.append(el('div','empty',q?'没有找到相关聊天':'还没有聊天对象，点击右上角 ＋ 添加吧！'))}
function openChat(id){current=id;const p=people.find(x=>x.id===id);if(!p)return;p.unread=0;save();updateHeart();$('chatTitle').textContent=p.name;$('chat').classList.add('show');renderMessages();$('messageInput').focus()}
function renderMessages(){const box=$('messages');box.replaceChildren();const p=people.find(x=>x.id===current);if(!p)return;let prevDay='';p.messages.forEach(m=>{const day=m.stamp?new Date(m.stamp).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}):'이전 대화 · 之前的聊天';if(day!==prevDay){box.append(el('div','day-divider',day));prevDay=day}const row=el('div','msgrow'+(m.mine?' mine':''));if(!m.mine)row.append(el('div','',p.emoji||'💛'));const b=el('div','bubble'+(m.photo?' image-bubble':''),m.text),t=el('span','msgtime',m.time||'');b.title='长按或右键可复制消息';b.oncontextmenu=e=>{e.preventDefault();if(confirm('复制这条消息？')){navigator.clipboard?.writeText(m.text).catch(()=>prompt('复制消息',m.text))}};if(m.mine)row.append(t,b);else row.append(b,t);box.append(row)});requestAnimationFrame(()=>box.scrollTop=box.scrollHeight)}
$('back').onclick=()=>{$('chat').classList.remove('show');current=null;$('typingIndicator').textContent='';renderList()};
const replyMemory={};
function choose(p,category,options){
 const k=p.id+':'+category,used=replyMemory[k]||[];
 let pool=options.map((_,i)=>i).filter(i=>!used.includes(i));
 if(!pool.length){used.length=0;pool=options.map((_,i)=>i)}
 const idx=pool[Math.floor(Math.random()*pool.length)];
 used.push(idx);replyMemory[k]=used;
 return options[idx];
}
function makeReply(p,text){
 const s=text.toLowerCase().trim();
 const last=p.messages.filter(m=>!m.mine).slice(-3).map(m=>m.text);
 const name=p.name;
 const topics=[
 ['sad',/难过|伤心|哭|委屈|不开心|烦|焦虑|压力|崩溃|累死|疲惫|心情不好|难受|ㅠㅠ/,['怎么啦？想说的话都可以告诉我，我认真听着呢。','今天是不是遇到什么不顺心的事了？我陪你聊一会儿。','辛苦了。要不要先跟我说说最让你烦心的那件事？','不想强撑也没关系。你现在最需要什么呀？','抱抱你 🫂 今天先对自己温柔一点。']],
 ['miss',/想你|想念|보고 싶|miss you|好想见|见面/,['나도 보고 싶었어 🥺 我也想你了。','突然说这种话，我会心动的啊。','那你说，我们下次见面先做什么？','我刚好也在想你，真的。','哎呀，害我现在一直盯着聊天框看。']],
 ['love',/喜欢你|爱你|사랑해|좋아해|表白|心动|亲亲|抱抱/,['你这么直接，我都不知道该怎么接了…💛','那我可以偷偷开心一整天吗？','你是认真的吗？我现在心跳有点快。','我也很珍惜和你聊天的每一分钟。','先给你一个大大的拥抱 🫶']],
 ['jealous',/吃醋|别的人|其他男|其他女|嫉妒|醋/,['诶？你这是在试探我吗？','怎么突然说这个，发生什么啦？','我更想知道你心里是怎么想的。','你这样问，我会忍不住多想诶。']],
 ['school',/学校|上课|考试|作业|高三|数学|英语|物理|学习|复习|背书|老师|成绩/,['今天学习怎么样？有没有哪一题特别折磨你？','先喝口水休息一下吧，努力也需要充电。','要不要给自己定个小目标？完成了就来找我邀功。','你最近真的很忙吧。今天最难的科目是什么？','我来当你的加油队！不过也别熬得太晚。']],
 ['food',/吃饭|饿|早餐|午餐|晚餐|夜宵|奶茶|咖啡|好吃|拉面|火锅/,['你这么一说我也饿了！想吃什么？','今天吃了什么好吃的？快给我安利。','下次一起去吃吧，先把想吃的记下来。','记得按时吃饭呀，别只顾着忙。']],
 ['sleep',/晚安|睡觉|困|失眠|熬夜|睡不着|잘 자/,['잘 자 🌙 做个好梦，明天再聊。','把手机放一边休息一下吧，晚安。','睡不着吗？要不要聊点轻松的？','晚安呀，今天也辛苦了。']],
 ['morning',/早安|早上好|起床|좋은 아침/,['早呀！今天想做的第一件事是什么？','좋은 아침 ☀️ 昨晚睡得好吗？','新的一天开始啦！今天也要开心。','早上好～吃早餐了吗？']],
 ['hello',/^(你好|嗨|hi|hello|hey|안녕|在吗|哈喽|喂)[！!。. ]*$/,['在呢！怎么突然来找我啦？','안녕～ 今天有什么新鲜事？','嗨！我刚好想找你聊天。','我在呀，快说快说！']],
 ['thanks',/谢谢|感谢|고마워|thank/,['不用谢啦，我们之间还这么客气？','嘿嘿，能帮到你就好。','고마워? 那请我喝奶茶吧，开玩笑的～']],
 ['question',/为什么|怎么|怎么办|吗[？?]?|是不是|什么|哪里|谁|？|\?/,['这个问题有意思，你怎么突然想到的？','我想先听听你的想法，可以吗？','如果是你的话，你会怎么选？','嗯…你能再多告诉我一点吗？','你这么问，是不是发生了什么事？']],
 ['laugh',/哈哈|hhh|ㅋㅋ|笑死|好笑|搞笑/,['ㅋㅋㅋ 你笑得我也想笑了！','到底什么事这么好笑，讲给我听！','你开心我也跟着开心了。']],
 ['angry',/生气|讨厌|烦死|无语|气死|滚/,['谁惹你生气了？跟我说说。','感觉你真的很不爽…要不要吐槽一下？','我先站在你这边听完，再一起想办法。']]
 ];
 for(const [key,re,options] of topics)if(re.test(s))return choose(p,key,options);
 const general=['诶，然后呢？我想听后续。','等等，这件事有点意思，继续说！','你这么说我突然好奇起来了。','那你当时是什么感觉？','我刚刚认真看了你发的话，想多听一点。','진짜? 真的假的？','你今天好像有很多话想说诶。','所以你接下来打算怎么办？','你觉得最有意思的是哪部分？','哈哈，怎么会突然想到这个？','我在听，你慢慢说。','然后发生什么了？'];
 let result=choose(p,'general',general);
 if(last.includes(result))result=choose(p,'general',general);
 return result;
}

const aiUrlKey='kkt_ai_worker_url_v1';
function configureAI(){
 const input=prompt('填写 Cloudflare Worker 完整网址（https://...workers.dev）。留空使用原来的模拟回复。不要填写 API Key。',localStorage.getItem(aiUrlKey)||'');
 if(input===null)return;
 const url=input.trim();
 if(url&&!/^https:\/\/[a-z0-9.-]+(?:\/[a-z0-9/_-]*)?$/i.test(url)){alert('请输入完整的 https:// Worker 网址');return}
 if(url)localStorage.setItem(aiUrlKey,url);else localStorage.removeItem(aiUrlKey);
 alert(url?'AI 地址已保存！可以发送消息测试了。':'已切回模拟回复。');
}
const aiButton=document.createElement('button');
aiButton.type='button';aiButton.textContent='🤖 AI设置';
aiButton.style.cssText='border:0;border-radius:14px;background:#fff3a2;padding:7px 10px;margin:4px;cursor:pointer;font-size:13px';
aiButton.onclick=configureAI;
$('sendForm').parentNode.insertBefore(aiButton,$('sendForm'));
async function getAIReply(p,text){
 const url=localStorage.getItem(aiUrlKey);
 if(!url)return personaReply(p,text);
 const recent=p.messages.slice(0,-1).slice(-12).map(m=>({role:m.mine?'user':'assistant',content:m.text}));
 const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,character:p.name,personality:charFor(p).personality,history:recent})});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||('HTTP '+response.status));
 const answer=data.reply||data.text;
 if(typeof answer!=='string'||!answer.trim())throw new Error('接口没有返回 reply');
 return answer.trim();
}
$('sendForm').onsubmit=async e=>{
 e.preventDefault();const inp=$('messageInput'),text=inp.value.trim(),p=people.find(x=>x.id===current);
 if(!text||!p)return;
 p.messages.push({mine:true,text,time:clock(),stamp:Date.now()});increaseHeart(p,2);inp.value='';save();renderMessages();
 const indicator=$('typingIndicator');indicator.replaceChildren(document.createTextNode(p.name+' 입력 중 · 正在输入 '));const dots=el('span','typing-dots');dots.setAttribute('aria-hidden','true');for(let i=0;i<3;i++)dots.append(el('i'));indicator.append(dots);
 const id=p.id;let answer;
 try{answer=await getAIReply(p,text)}catch(err){answer='⚠️ AI 暂时无法回复：'+String(err.message||err).slice(0,160)+'。请稍后重试或检查 AI 设置。'}
 if(current===id)await new Promise(resolve=>setTimeout(resolve,Math.min(1400,Math.max(350,answer.length*14))));
 const target=people.find(x=>x.id===id);if(!target)return;
 target.messages.push({mine:false,text:answer,time:clock(),stamp:Date.now()});
 if(current!==id)target.unread=(target.unread||0)+1;
 save();if(current===id){$('typingIndicator').textContent='';renderMessages()}else renderList();
};

$('tabFriends').onclick=()=>setTab('friends');
$('add').onclick=()=>{$('dialog').classList.add('show');$('personName').focus()};
$('cancel').onclick=()=>{$('dialog').classList.remove('show')};
$('save').onclick=()=>{const name=$('personName').value.trim(),emoji=$('personEmoji').value.trim()||'💛';if(!name){alert('先输入昵称哦');return}people.push({id:String(Date.now()),name,emoji,messages:[]});save();$('dialog').classList.remove('show');$('personName').value='';$('personEmoji').value='';renderList()};
$('chatInfoBtn').onclick=()=>{const p=people.find(x=>x.id===current);if(!p)return;$('chatInfoSummary').textContent=p.name+' · '+p.messages.length+' 条消息 · 仅保存在本机';$('chatInfo').classList.add('show')};

$('chatInfo').onclick=e=>{if(e.target===$('chatInfo'))$('chatInfo').classList.remove('show')};
function chatTranscript(){const p=people.find(x=>x.id===current);if(!p)return '';return p.messages.map(m=>'['+(m.time||'')+'] '+(m.mine?(extras.nickname||'我'):p.name)+': '+m.text).join('\\n')}
$('copyChatBtn').onclick=async()=>{const text=chatTranscript();if(!text)return alert('还没有聊天记录');try{await navigator.clipboard.writeText(text);alert('聊天记录已复制')}catch(e){prompt('请手动复制聊天记录',text)}};
$('exportChatBtn').onclick=()=>{const p=people.find(x=>x.id===current);if(!p)return;const blob=new Blob([chatTranscript()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KKT-'+p.name.replace(/[\\/:*?"<>|]/g,'_')+'-聊天记录.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('clear').onclick=()=>{if(!confirm('要清空这个聊天对象的全部聊天记录吗？此操作不可撤销。'))return;const p=people.find(x=>x.id===current);if(p){p.messages=[];save();renderMessages();$('chatInfo').classList.remove('show')}};


const extraKey='kkt-simulator-extras-v1';
let extras;try{extras=JSON.parse(localStorage.getItem(extraKey))||{}}catch(e){extras={}}
extras.moments=Array.isArray(extras.moments)?extras.moments:[{id:'sample1',name:'小星',emoji:'🐹',text:'오늘 날씨 진짜 좋다 ☀️\n今天的天气真好，想出去走走。',likes:2,comments:[]}];
extras.profiles=extras.profiles||{};

let profileId=null;
$('profileBack').onclick=()=>$('profileSheet').classList.remove('show');
$('profileChat').onclick=()=>{$('profileSheet').classList.remove('show');openChat(profileId)};
$('momentsBack').onclick=()=>$('momentsSheet').classList.remove('show');

function renderMoments(){const box=$('momentsList');box.replaceChildren();extras.moments.slice().reverse().forEach(post=>{const card=el('article','moment-card');const head=el('div','moment-head');head.append(el('span','',post.emoji||'🌷'),el('strong','',post.name||'나'));card.append(head,el('p','',post.text));const comments=el('div','moment-comments');(post.comments||[]).forEach(c=>comments.append(el('div','',c)));card.append(comments);const actions=el('div','moment-actions');const like=el('button','', '♡ 좋아요 '+(post.likes||0));like.onclick=()=>{post.likes=(post.likes||0)+1;saveExtras();renderMoments()};const comment=el('button','','💬 댓글 · 评论');comment.onclick=()=>{const c=prompt('댓글을 남겨 주세요 · 写下评论');if(!c||!c.trim())return;post.comments=post.comments||[];post.comments.push((extras.nickname||'나')+': '+c.trim().slice(0,200));saveExtras();renderMoments()};actions.append(like,comment);card.append(actions);box.append(card)})}
$('postMoment').onclick=()=>{const text=$('momentText').value.trim();if(!text)return;extras.moments.push({id:String(Date.now()),name:extras.nickname||'나',emoji:extras.avatar||'🌷',text,likes:0,comments:[]});$('momentText').value='';saveExtras();renderMoments()};
function openSettings(){$('proactiveEnabled').checked=extras.proactiveEnabled!==false;$('myNickname').value=extras.nickname||'';$('myStatus').value=extras.status||'';$('myAvatar').value=extras.avatar||'';$('themeSelect').value=extras.theme||'blue';$('bubbleSelect').value=extras.bubble||'yellow';$('settingsSheet').classList.add('show')}

applyStyle();


const characterKey='kkt-character-3';
let characterData;try{characterData=JSON.parse(localStorage.getItem(characterKey))||{}}catch(e){characterData={}}
const saveCharacters=()=>{try{localStorage.setItem(characterKey,JSON.stringify(characterData))}catch(e){}};
const charFor=p=>characterData[p.id]||(characterData[p.id]={heart:0,personality:'gentle',stage:0});
function updateHeart(){const p=people.find(x=>x.id===current);if(!p)return;const d=charFor(p);$('heartMeter').textContent='♡ '+d.heart+' · '+(d.heart<20?'初识':d.heart<55?'朋友':d.heart<90?'暧昧':'恋人');$('heartProgress').style.width=d.heart+'%'}
function increaseHeart(p,amount){const d=charFor(p),old=d.heart;d.heart=Math.min(100,d.heart+amount);saveCharacters();if(current===p.id)updateHeart();if((old<20&&d.heart>=20)||(old<55&&d.heart>=55)||(old<90&&d.heart>=90)){p.messages.push({mine:false,text:d.heart>=90?'우리 이제 특별한 사이인 거지? 💛':d.heart>=55?'요즘 너랑 얘기하는 게 제일 좋아.':'우리 이제 좀 친해진 것 같지? ㅎㅎ',time:clock(),stamp:Date.now()});save()}}
function personaReply(p,text){const d=charFor(p);const base=makeReply(p,text);if(d.personality==='playful')return ['ㅋㅋㅋ','야~','어이구'][Math.floor(Math.random()*3)]+' '+base;if(d.personality==='cool')return base.replace(/！/g,'.').replace(/～/g,'.');if(d.personality==='sweet')return base+' ♡';return base}
function openEditor(){const p=people.find(x=>x.id===current);if(!p)return;const d=charFor(p);$('editName').value=p.name;$('editEmoji').value=p.emoji||'';$('editStatus').value=extras.profiles[p.id]||'';$('editPersonality').value=d.personality;$('editorSheet').classList.add('show')}
$('editBtn').onclick=openEditor;
$('editorBack').onclick=()=>$('editorSheet').classList.remove('show');
$('saveEditor').onclick=()=>{const p=people.find(x=>x.id===current);if(!p)return;const name=$('editName').value.trim();if(!name)return alert('请输入昵称');p.name=name;p.emoji=$('editEmoji').value.trim()||'💛';extras.profiles[p.id]=$('editStatus').value.trim();charFor(p).personality=$('editPersonality').value;save();saveExtras();saveCharacters();$('chatTitle').textContent=p.name;$('editorSheet').classList.remove('show');renderMessages()};
let callStart=0,callTimer=null;
function endCall(){clearInterval(callTimer);callTimer=null;$('callSheet').classList.remove('show')}
$('callBtn').onclick=()=>{const p=people.find(x=>x.id===current);if(!p)return;$('callName').textContent=p.name;$('callAvatar').textContent=p.emoji||'💛';$('callStatus').textContent='연결 중… · 正在呼叫';$('answerBtn').style.display='';$('callSheet').classList.add('show')};
$('answerBtn').onclick=()=>{callStart=Date.now();$('answerBtn').style.display='none';$('callStatus').textContent='00:00 · 模拟通话中';clearInterval(callTimer);callTimer=setInterval(()=>{const t=Math.floor((Date.now()-callStart)/1000);$('callStatus').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')+' · 模拟通话中'},1000)};
$('hangupBtn').onclick=endCall;
const photoEmojis=['🌸','📷','☕','🐱','🌙','🎧','🌷','🍰','🌊','🧸','💐','✨'];
$('albumBtn').onclick=()=>{$('albumSheet').classList.add('show')};
$('photoBtn').onclick=()=>{$('albumSheet').classList.add('show')};
$('albumBack').onclick=()=>$('albumSheet').classList.remove('show');
photoEmojis.forEach(emoji=>{const tile=el('button','album-tile',emoji);tile.onclick=()=>{const p=people.find(x=>x.id===current);if(!p)return;p.messages.push({mine:true,text:emoji,photo:true,time:clock(),stamp:Date.now()});save();renderMessages();$('albumSheet').classList.remove('show')};$('albumGrid').append(tile)});
let proactiveTimer=setInterval(()=>{if(document.hidden||!people.length||extras.proactiveEnabled===false)return;const candidates=people.filter(p=>p.messages.length>0);if(!candidates.length)return;const p=candidates[Math.floor(Math.random()*candidates.length)];if(Date.now()-(p.lastProactive||0)<900000)return;p.lastProactive=Date.now();const lines=['뭐 해? 지금 생각나서 연락했어 💛','오늘 하루 어땠어?','밥은 먹었어? 🍚','갑자기 네 생각났어 ㅎㅎ'];p.messages.push({mine:false,text:lines[Math.floor(Math.random()*lines.length)],time:clock(),stamp:Date.now()});if(current!==p.id)p.unread=(p.unread||0)+1;save();if(current===p.id)renderMessages();else renderList()},240000);

function setTab(next){tab=next;$('tabChats').classList.toggle('active',next==='chats');$('tabFriends').classList.toggle('active',next==='friends');$('navChats').classList.toggle('selected',next==='chats');$('navFriends').classList.toggle('selected',next==='friends');$('searchContacts').placeholder=next==='friends'?'친구 검색 · 搜索好友':'채팅 검색 · 搜索聊天';$('searchContacts').value='';renderList()}
$('navChats').onclick=()=>setTab('chats');
$('navFriends').onclick=()=>setTab('friends');
$('navDiscover').onclick=()=>{$('momentsSheet').classList.add('show');renderMoments()};
$('navMore').onclick=openSettings;
$('searchContacts').oninput=renderList;
save();renderList();
})();
</script></body></html>
