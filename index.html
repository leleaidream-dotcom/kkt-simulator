<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9e45b"><title>KKT 聊天模拟器</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#292929;background:#f8f8f8}button,input{font:inherit}button{cursor:pointer;border:0}header{background:#f9e45b;padding:calc(env(safe-area-inset-top) + 18px) 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:23px;margin:0}header button{background:transparent;font-size:25px}main{max-width:600px;margin:auto}.tabs{display:flex;background:white;border-bottom:1px solid #eee}.tabs button{flex:1;padding:14px 4px;background:white;color:#777}.tabs button.active{color:#111;border-bottom:3px solid #f5d82d;font-weight:700}.contact{display:flex;align-items:center;gap:13px;padding:17px 20px;background:#fff;border-bottom:1px solid #f0f0f0;width:100%;text-align:left}.avatar{width:51px;height:51px;display:grid;place-items:center;border-radius:18px;background:#e5d7ff;font-size:27px;flex-shrink:0}.contact .info{flex:1;min-width:0}.name{font-weight:650;font-size:16px}.preview{color:#888;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.time{font-size:11px;color:#999}.empty{padding:45px 20px;text-align:center;color:#888}.hint{padding:15px 20px;color:#888;font-size:12px}.chat{display:none;position:fixed;inset:0;background:#b2c7da;z-index:10;flex-direction:column}.chat.show{display:flex}.chatbar{padding:calc(env(safe-area-inset-top) + 12px) 15px 12px;display:flex;align-items:center;gap:12px;background:#b2c7da}.chatbar button{background:none;font-size:25px}.chatbar strong{flex:1;font-size:18px}.messages{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:13px}.msgrow{display:flex;gap:8px;align-items:flex-end}.msgrow.mine{justify-content:flex-end}.bubble{max-width:75%;background:white;border-radius:4px 13px 13px 13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:15px}.mine .bubble{background:#ffe954;border-radius:13px 4px 13px 13px}.msgtime{font-size:10px;color:#5e6b75}.composer{background:#fff;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:9px;align-items:flex-end}.composer input{min-width:0;flex:1;border:1px solid #eee;border-radius:18px;padding:12px;background:#fafafa;outline:none}.composer button,.primary{background:#f9e45b;border-radius:12px;padding:11px 16px;font-weight:650}.dialog{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:20px}.dialog.show{display:flex}.panel{background:white;border-radius:20px;padding:22px;width:100%;max-width:360px}.panel h2{margin:0 0 18px;font-size:20px}.panel label{display:block;margin:12px 0 5px;font-size:13px;color:#666}.panel input{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.actions button{padding:10px 15px;border-radius:10px}.actions .cancel{background:#eee}

/* Korean messenger-inspired refresh */
:root{--k-yellow:#fee500;--k-blue:#abc1d1;--k-text:#262626}
html{background:#fff}body{color:var(--k-text);background:#fff;letter-spacing:-.25px}
main{min-height:100dvh;background:#fff}
header{background:#fff;padding:calc(env(safe-area-inset-top) + 27px) 23px 20px;border-bottom:0}
header h1{font-size:26px;letter-spacing:-1.1px;font-weight:800}
header button{font-weight:300;color:#202020;font-size:31px}
.tabs{border:0;padding:0 20px 8px;gap:22px}
.tabs button{flex:0 0 auto;border:0!important;padding:9px 2px;font-size:14px;color:#a1a1a1}
.tabs button.active{color:#252525!important;font-weight:750}
.contact{padding:15px 22px;gap:14px;border-bottom:0;min-height:81px}
.contact:active{background:#f7f7f7}
.avatar{width:57px;height:57px;border-radius:20px;background:#e6e1d9;font-size:29px}
.contact:nth-child(3n+2) .avatar{background:#e1e8f0}
.contact:nth-child(3n+3) .avatar{background:#f3e5db}
.name{font-size:16px;font-weight:650}
.preview{font-size:13px;color:#979797;margin-top:7px}
.time{align-self:flex-start;margin-top:8px;font-size:10px;color:#b1b1b1}
.hint{font-size:11px;color:#bbb;padding:22px;text-align:center}
.chat{background:var(--k-blue)}
.chatbar{background:var(--k-blue);padding:calc(env(safe-area-inset-top) + 13px) 17px 15px}
.chatbar strong{font-size:18px;font-weight:700}
.chatbar button{font-size:29px;font-weight:300;color:#202b32}
.messages{gap:16px;padding:19px 13px 25px}
.msgrow{gap:8px}
.msgrow:not(.mine)>div:first-child:not(.bubble){width:36px;height:36px;border-radius:13px;background:#e9e1d6;display:grid;place-items:center;font-size:21px}
.bubble{font-size:15px;line-height:1.48;max-width:75%;padding:10px 12px;background:#fff;border-radius:3px 12px 12px 12px;box-shadow:0 1px 1px #4d62700a}
.mine .bubble{background:var(--k-yellow);border-radius:12px 3px 12px 12px}
.msgtime{color:#5c7585;font-size:10px}
.composer{background:#fff;padding:10px 13px calc(env(safe-area-inset-bottom) + 10px);gap:8px}
.composer input{background:#fff;border:1px solid #e6e6e6;border-radius:19px;padding:11px 14px;font-size:15px}
.composer button,.primary{background:var(--k-yellow);border-radius:9px;color:#222;font-weight:600}
.panel{border-radius:18px}.panel h2{font-size:19px}
@media(min-width:601px){main{border-left:1px solid #eee;border-right:1px solid #eee}}
</style></head><body><main><header><h1>채팅 <span style="font-size:12px;font-weight:500;color:#999;letter-spacing:0">KKT</span></h1><button id="add" aria-label="添加聊天对象">＋</button></header><nav class="tabs"><button class="active" id="tabChats">채팅 · 聊天</button><button id="tabFriends">친구 · 好友</button></nav><section id="list"></section><p class="hint">KKT · 나만의 작은 대화 공간 ♡<br><small>虚构聊天 · 记录仅保存在本机</small></p></main>
<section class="chat" id="chat"><div class="chatbar"><button id="back" aria-label="返回">‹</button><strong id="chatTitle"></strong><button id="clear" title="清空当前聊天">⋯</button></div><div class="messages" id="messages"></div><form class="composer" id="sendForm"><input id="messageInput" placeholder="메시지 보내기 · 发送消息…" autocomplete="off" maxlength="1000"><button type="submit">전송</button></form></section>
<div class="dialog" id="dialog"><div class="panel"><h2>친구 추가 · 添加好友</h2><label for="personName">昵称</label><input id="personName" placeholder="例如：小星"><label for="personEmoji">头像表情</label><input id="personEmoji" placeholder="例如：🐹" maxlength="8"><div class="actions"><button class="cancel" id="cancel">取消</button><button class="primary" id="save">添加</button></div></div></div>
<script>
(()=>{'use strict';
const key='kkt-simulator-v2';
const defaults=[{id:'a',name:'小星',emoji:'🐹',messages:[{mine:false,text:'안녕! 今天过得怎么样？',time:'12:30'}]},{id:'b',name:'小海',emoji:'🐻',messages:[{mine:false,text:'有空的时候来找我聊天吧 💛',time:'12:31'}]}];
let people;try{const x=JSON.parse(localStorage.getItem(key));people=Array.isArray(x)?x:defaults}catch(e){people=defaults}
let current=null,tab='chats';
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(key,JSON.stringify(people))}catch(e){}};
const clock=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function renderList(){const list=$('list');list.replaceChildren();people.forEach(p=>{const row=el('button','contact');row.type='button';row.append(el('div','avatar',p.emoji||'💛'));const info=el('div','info');info.append(el('div','name',p.name));const last=p.messages[p.messages.length-1];info.append(el('div','preview',tab==='friends'?'点击开始聊天':last?last.text:'开始聊天吧'));row.append(info,el('span','time',last&&tab==='chats'?last.time:''));row.onclick=()=>openChat(p.id);list.append(row)});if(!people.length)list.append(el('div','empty','还没有聊天对象，点击右上角 ＋ 添加吧！'))}
function openChat(id){current=id;const p=people.find(x=>x.id===id);if(!p)return;$('chatTitle').textContent=p.name;$('chat').classList.add('show');renderMessages();$('messageInput').focus()}
function renderMessages(){const box=$('messages');box.replaceChildren();const p=people.find(x=>x.id===current);if(!p)return;p.messages.forEach(m=>{const row=el('div','msgrow'+(m.mine?' mine':''));if(!m.mine)row.append(el('div','',p.emoji||'💛'));const b=el('div','bubble',m.text),t=el('span','msgtime',m.time||'');if(m.mine)row.append(t,b);else row.append(b,t);box.append(row)});requestAnimationFrame(()=>box.scrollTop=box.scrollHeight)}
$('back').onclick=()=>{$('chat').classList.remove('show');current=null;renderList()};
const replyMemory={};
function choose(p,category,options){
 const k=p.id+':'+category,used=replyMemory[k]||[];
 let pool=options.map((_,i)=>i).filter(i=>!used.includes(i));
 if(!pool.length){used.length=0;pool=options.map((_,i)=>i)}
 const idx=pool[Math.floor(Math.random()*pool.length)];
 used.push(idx);replyMemory[k]=used;
 return options[idx];
}
function makeReply(p,text){
 const s=text.toLowerCase().trim();
 const last=p.messages.filter(m=>!m.mine).slice(-3).map(m=>m.text);
 const name=p.name;
 const topics=[
 ['sad',/难过|伤心|哭|委屈|不开心|烦|焦虑|压力|崩溃|累死|疲惫|心情不好|难受|ㅠㅠ/,['怎么啦？想说的话都可以告诉我，我认真听着呢。','今天是不是遇到什么不顺心的事了？我陪你聊一会儿。','辛苦了。要不要先跟我说说最让你烦心的那件事？','不想强撑也没关系。你现在最需要什么呀？','抱抱你 🫂 今天先对自己温柔一点。']],
 ['miss',/想你|想念|보고 싶|miss you|好想见|见面/,['나도 보고 싶었어 🥺 我也想你了。','突然说这种话，我会心动的啊。','那你说，我们下次见面先做什么？','我刚好也在想你，真的。','哎呀，害我现在一直盯着聊天框看。']],
 ['love',/喜欢你|爱你|사랑해|좋아해|表白|心动|亲亲|抱抱/,['你这么直接，我都不知道该怎么接了…💛','那我可以偷偷开心一整天吗？','你是认真的吗？我现在心跳有点快。','我也很珍惜和你聊天的每一分钟。','先给你一个大大的拥抱 🫶']],
 ['jealous',/吃醋|别的人|其他男|其他女|嫉妒|醋/,['诶？你这是在试探我吗？','怎么突然说这个，发生什么啦？','我更想知道你心里是怎么想的。','你这样问，我会忍不住多想诶。']],
 ['school',/学校|上课|考试|作业|高三|数学|英语|物理|学习|复习|背书|老师|成绩/,['今天学习怎么样？有没有哪一题特别折磨你？','先喝口水休息一下吧，努力也需要充电。','要不要给自己定个小目标？完成了就来找我邀功。','你最近真的很忙吧。今天最难的科目是什么？','我来当你的加油队！不过也别熬得太晚。']],
 ['food',/吃饭|饿|早餐|午餐|晚餐|夜宵|奶茶|咖啡|好吃|拉面|火锅/,['你这么一说我也饿了！想吃什么？','今天吃了什么好吃的？快给我安利。','下次一起去吃吧，先把想吃的记下来。','记得按时吃饭呀，别只顾着忙。']],
 ['sleep',/晚安|睡觉|困|失眠|熬夜|睡不着|잘 자/,['잘 자 🌙 做个好梦，明天再聊。','把手机放一边休息一下吧，晚安。','睡不着吗？要不要聊点轻松的？','晚安呀，今天也辛苦了。']],
 ['morning',/早安|早上好|起床|좋은 아침/,['早呀！今天想做的第一件事是什么？','좋은 아침 ☀️ 昨晚睡得好吗？','新的一天开始啦！今天也要开心。','早上好～吃早餐了吗？']],
 ['hello',/^(你好|嗨|hi|hello|hey|안녕|在吗|哈喽|喂)[！!。. ]*$/,['在呢！怎么突然来找我啦？','안녕～ 今天有什么新鲜事？','嗨！我刚好想找你聊天。','我在呀，快说快说！']],
 ['thanks',/谢谢|感谢|고마워|thank/,['不用谢啦，我们之间还这么客气？','嘿嘿，能帮到你就好。','고마워? 那请我喝奶茶吧，开玩笑的～']],
 ['question',/为什么|怎么|怎么办|吗[？?]?|是不是|什么|哪里|谁|？|\?/,['这个问题有意思，你怎么突然想到的？','我想先听听你的想法，可以吗？','如果是你的话，你会怎么选？','嗯…你能再多告诉我一点吗？','你这么问，是不是发生了什么事？']],
 ['laugh',/哈哈|hhh|ㅋㅋ|笑死|好笑|搞笑/,['ㅋㅋㅋ 你笑得我也想笑了！','到底什么事这么好笑，讲给我听！','你开心我也跟着开心了。']],
 ['angry',/生气|讨厌|烦死|无语|气死|滚/,['谁惹你生气了？跟我说说。','感觉你真的很不爽…要不要吐槽一下？','我先站在你这边听完，再一起想办法。']]
 ];
 for(const [key,re,options] of topics)if(re.test(s))return choose(p,key,options);
 const general=['诶，然后呢？我想听后续。','等等，这件事有点意思，继续说！','你这么说我突然好奇起来了。','那你当时是什么感觉？','我刚刚认真看了你发的话，想多听一点。','진짜? 真的假的？','你今天好像有很多话想说诶。','所以你接下来打算怎么办？','你觉得最有意思的是哪部分？','哈哈，怎么会突然想到这个？','我在听，你慢慢说。','然后发生什么了？'];
 let result=choose(p,'general',general);
 if(last.includes(result))result=choose(p,'general',general);
 return result;
}
$('sendForm').onsubmit=e=>{e.preventDefault();const inp=$('messageInput'),text=inp.value.trim(),p=people.find(x=>x.id===current);if(!text||!p)return;p.messages.push({mine:true,text,time:clock()});inp.value='';save();renderMessages();const id=p.id;setTimeout(()=>{const target=people.find(x=>x.id===id);if(!target)return;target.messages.push({mine:false,text:makeReply(target,text),time:clock()});save();if(current===id)renderMessages();else renderList()},800+Math.random()*700)};
$('tabChats').onclick=()=>{tab='chats';$('tabChats').classList.add('active');$('tabFriends').classList.remove('active');renderList()};
$('tabFriends').onclick=()=>{tab='friends';$('tabFriends').classList.add('active');$('tabChats').classList.remove('active');renderList()};
$('add').onclick=()=>{$('dialog').classList.add('show');$('personName').focus()};
$('cancel').onclick=()=>{$('dialog').classList.remove('show')};
$('save').onclick=()=>{const name=$('personName').value.trim(),emoji=$('personEmoji').value.trim()||'💛';if(!name){alert('先输入昵称哦');return}people.push({id:String(Date.now()),name,emoji,messages:[]});save();$('dialog').classList.remove('show');$('personName').value='';$('personEmoji').value='';renderList()};
$('clear').onclick=()=>{if(!confirm('要清空这个聊天对象的全部聊天记录吗？'))return;const p=people.find(x=>x.id===current);if(p){p.messages=[];save();renderMessages()}};
save();renderList();
})();
</script></body></html>
